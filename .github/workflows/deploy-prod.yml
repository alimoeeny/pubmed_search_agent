name: Test & Deploy (prod)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  REGION:   us-east1
  REGISTRY: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pubmed-agent
  IMAGE:    pubmed-agent

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

  # Frontend (www/) is deployed via Cloudflare Pages Git integration.
  # CF dashboard settings:
  #   Build command : cd www && pnpm install && pnpm build --mode prod
  #   Output dir    : www/dist
  #   Branch        : main (production), all other branches get preview URLs

  deploy:
    name: Build & deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account:            ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run (update image only if service exists)
        run: |
          if gcloud run services describe ${{ env.IMAGE }} \
               --region=${{ env.REGION }} \
               --project=${{ secrets.GCP_PROJECT_ID }} \
               --quiet 2>/dev/null; then
            gcloud run deploy ${{ env.IMAGE }} \
              --image=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
              --region=${{ env.REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --quiet
          else
            echo "Cloud Run service not yet created — Terraform will provision it on first apply."
          fi
